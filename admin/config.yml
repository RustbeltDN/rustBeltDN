backend:
  name: github
  repo: RustbeltDN/rustBeltDN
  branch: main
  base_url: https://sveltia-cms-auth.ebbondar.workers.dev

# Every submission opens a pull request instead of publishing straight to
# main, giving you a review/moderation step before anything goes live.
publish_mode: editorial_workflow

media_folder: "src/img/members"
public_folder: "/img/members"

# By default Sveltia CMS keeps uploaded filenames exactly as-is (spaces,
# accents, etc.), which can break links on GitHub Pages. This sanitizes
# them into safe, hyphenated filenames automatically.
media_libraries:
  default:
    config:
      slugify_filename: true

collections:
  - name: who
    label: Who We Are (Member Profiles)
    folder: src/who
    create: true
    slug: "{{fields.name | slugify}}"
    format: frontmatter
    fields:
      - { label: Full Name, name: name, widget: string }
      - label: Last Name (for alphabetizing)
        name: sortName
        widget: string
        hint: "Used to sort and group the directory — use your last name, or whatever name you'd like listed under."
      - { label: Pronouns, name: pronouns, widget: string, required: false }
      - { label: Role, name: role, widget: string, required: false }
      - { label: Photo, name: photo, widget: image, required: false }
      - { label: Bio, name: body, widget: markdown }
      - label: Projects
        name: projects
        widget: list
        required: false
        label_singular: Project
        hint: "Optional — add one entry per project you'd like to share."
        fields:
          - { label: Project Title, name: title, widget: string }
          - { label: Project Image, name: image, widget: image, required: false }
          - { label: Project Link, name: url, widget: string, required: false, hint: "Optional — where should the title/image link to?" }
          - { label: Description, name: description, widget: markdown, required: false }

  - name: events
    label: Events
    folder: src/events
    create: true
    slug: "{{fields.title | slugify}}"
    format: frontmatter
    fields:
      - { label: Event Title (What), name: title, widget: string }
      - { label: Hosted By (Who), name: who, widget: string }
      - { label: Date (When), name: when, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: Location (Where), name: where, widget: string }
      - { label: Image, name: image, widget: image, required: false, media_folder: "src/img/events", public_folder: "/img/events" }
      - { label: Description, name: body, widget: markdown, required: false }